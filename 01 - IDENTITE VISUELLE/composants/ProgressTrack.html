<!-- @dsCard group="Cours" height=230 subtitle="Avancement d'un module et du parcours" -->
<div style="padding:24px;display:grid;gap:28px;max-width:560px">
  <div class="dp-progress">
    <div class="dp-progress__head">
      <span style="font:700 16px/1.3 var(--font-sans)">Module 2 · Créer ton produit</span>
      <span style="font:700 15px/1 var(--font-mono);color:var(--brand-strong)">4/6</span>
    </div>
    <div class="dp-progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="4" aria-label="Leçons terminées"><div class="dp-progress__bar" style="width:66.6%"></div></div>
  </div>

  <div>
    <div class="dp-overline" style="margin-bottom:12px">Ton parcours</div>
    <ol style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px" aria-label="Étapes du parcours">
      <li title="Produit"><div style="height:8px;border-radius:999px;background:var(--brand)"></div><div style="font:600 13px/1.4 var(--font-sans);margin-top:6px">Produit</div></li>
      <li title="Page"><div style="height:8px;border-radius:999px;background:var(--brand)"></div><div style="font:600 13px/1.4 var(--font-sans);margin-top:6px">Page</div></li>
      <li title="Paiement" aria-current="step"><div style="height:8px;border-radius:999px;background:var(--surface-sunken);overflow:hidden"><div class="dp-progress__bar" style="width:50%"></div></div><div style="font:800 13px/1.4 var(--font-sans);margin-top:6px;color:var(--brand-strong)">Paiement</div></li>
      <li title="Publicité"><div style="height:8px;border-radius:999px;background:var(--surface-sunken)"></div><div style="font:600 13px/1.4 var(--font-sans);margin-top:6px;color:var(--ink-muted)">Publicité</div></li>
      <li title="Automatiser"><div style="height:8px;border-radius:999px;background:var(--surface-sunken)"></div><div style="font:600 13px/1.4 var(--font-sans);margin-top:6px;color:var(--ink-muted)">Automatiser</div></li>
    </ol>
  </div>
</div>
