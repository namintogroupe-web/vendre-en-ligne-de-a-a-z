  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="dp-btn dp-btn--primary">Commencer la leçon
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button class="dp-btn dp-btn--volt dp-btn--lg">Je lance ma campagne
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="dp-btn dp-btn--secondary">Revoir la vidéo</button>
    <button class="dp-btn dp-btn--ghost">Télécharger le résumé</button>
